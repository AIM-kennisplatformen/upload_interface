[project]
authors = [{name = "Victor Hogeweij", email = "hogeweyv@gmail.com"}]
name = "upload_interface"
requires-python = ">= 3.11"
version = "0.1.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
authlib = ">=1.0.0"
fastapi = ">=0.100.0"
httpx = ">=0.28.1,<0.29"
itsdangerous = ">=2.2.0,<3"
python-multipart = ">=0.0.6"
uvicorn = { version = ">=0.23.0", extras = ["standard"] }

[tool.pixi.tasks]
backend = { cmd = "uvicorn backend.main:app --port 8000 --reload", cwd = "src" }
frontend = { cmd = "npm run dev", cwd = "src/frontend" }
