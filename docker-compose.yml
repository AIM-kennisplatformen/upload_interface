# Reference deployment for this repo's frontend + Caddy edge. Only this
# one service is defined here -- scepa-rs, Studio, and an Authentik proxy
# outpost are separate deployments; put them on the same Docker network
# (or otherwise make them reachable) and point the env vars below at them.
#
# UNTESTED against a real Authentik outpost -- see Caddyfile.

services:
  frontend:
    build: .
    container_name: kp-upload-interface
    ports:
      - "80:80"
    environment:
      SITE_ADDRESS: ":80"
      AUTHENTIK_OUTPOST: ""
      SCEPA_METADATA_HOST: ""
      STUDIO_HOST: ""
      METADATA_API_KEY: ""
      STUDIO_API_KEY: ""
    restart: unless-stopped
